name: Synchronize Crowdin translations

on:
  push:
    branches:
      - main
    paths:
      - "src/locales/**"
      - "crowdin.yml"
      - ".github/workflows/crowdin.yml"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: crowdin-locales
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Synchronize with Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: true
          download_translations: true
          skip_untranslated_strings: false
          localization_branch_name: l10n_crowdin_translations
          create_pull_request: true
          pull_request_title: "chore(i18n): update Crowdin translations"
          pull_request_body: |
            This PR contains translations downloaded from Crowdin.

            Please review the generated locale files and run the normal frontend checks before merging.
          pull_request_base_branch_name: main
          commit_message: "chore(i18n): sync translations from Crowdin"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
