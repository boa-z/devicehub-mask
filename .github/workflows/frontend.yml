name: Verify frontend

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check locale resources
        run: npm run locales:check

      - name: Check documentation
        run: npm run docs:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build and check budget
        run: npm run build
