[package]
name = "devicehub-host"
version = "0.1.0"
edition = "2024"
description = "Shared operating-system adapters for DeviceHub hosts"
license = "MIT"

[dependencies]
bytes = "1"
devicehub-core = { path = "../devicehub-core" }
devicehub-runtime = { path = "../devicehub-runtime" }
devicehub-server = { path = "../devicehub-server" }
plist = "1"
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "sync", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
cms = "0.3.0-pre.2"
der = "0.8.1"
