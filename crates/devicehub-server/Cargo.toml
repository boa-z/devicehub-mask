[package]
name = "devicehub-server"
version = "0.1.0"
edition = "2024"
description = "Host-independent HTTP and WebSocket adapters for DeviceHub"
license = "AGPL-3.0-only"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
devicehub-core = { path = "../devicehub-core" }
devicehub-keymap = { path = "../devicehub-keymap" }
devicehub-runtime = { path = "../devicehub-runtime" }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
rmcp = { version = "1.7", features = ["transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
uuid = "1"
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
devicehub-runtime = { path = "../devicehub-runtime", features = ["test-support"] }
rmcp = { version = "1.7", features = ["client", "reqwest", "transport-streamable-http-client-reqwest"] }
tower = { version = "0.5", features = ["util"] }
